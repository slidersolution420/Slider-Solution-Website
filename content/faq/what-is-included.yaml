question_he: מה כלול בקיט SLIDER?
question_en: What's included in the SLIDER kit?
answer_he: >
  הקיט כולל: מטחנה מרובעת (לא נתקעת), משפך מובנה, תא אחסון גדול, 5 קונוסים ריקים ומגש עמיד בפני רוח.
  הכל במכשיר קומפקטי אחד.
answer_en: >
  The kit includes: a square grinder (never jams), built-in funnel, large storage compartment,
  5 empty cones, and a wind-resistant tray. Everything in one compact device.
order: 1
