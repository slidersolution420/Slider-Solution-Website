question_he: האם המטחנה באמת לא נתקעת?
question_en: Does the grinder really not jam?
answer_he: >
  כן! הצורה המרובעת עם הצירים הנפרדים מונעת את החסימה הנפוצה במטחנות עגולות.
  החומר לא נצבר בפינות ותמיד נופל בחופשיות.
answer_en: >
  Yes! The rectangular shape with separated axes prevents the common jamming found in round grinders.
  Material doesn't accumulate in corners and always falls freely.
order: 2
